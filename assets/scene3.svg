<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="60%" r="65%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="25%" stop-color="#f6a035"/>
      <stop offset="55%" stop-color="#cf3d3e"/>
      <stop offset="85%" stop-color="#3d1435"/>
      <stop offset="100%" stop-color="#14071d"/>
    </radialGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Sunset Glow -->
  <rect width="1200" height="800" fill="url(#sunGlow)"/>
  
  <!-- Golden Sun Core -->
  <circle cx="600" cy="460" r="140" fill="#fff9db" opacity="0.85" filter="url(#cinematicGlow)"/>
  
  <!-- Bokeh Lights -->
  <circle cx="350" cy="300" r="50" fill="#ffd166" opacity="0.25" filter="url(#cinematicGlow)"/>
  <circle cx="850" cy="240" r="70" fill="#ff9e00" opacity="0.2" filter="url(#cinematicGlow)"/>
  <circle cx="200" cy="500" r="90" fill="#ff5400" opacity="0.25" filter="url(#cinematicGlow)"/>
  <circle cx="1020" cy="420" r="60" fill="#ffd166" opacity="0.3" filter="url(#cinematicGlow)"/>

  <!-- Silhouettes of joy & celebration -->
  <g fill="#12051a" opacity="0.95">
    <!-- Mountain ridge / hills -->
    <path d="M0,640 Q300,560 600,600 T1200,580 L1200,800 L0,800 Z" />
    <path d="M0,690 Q400,630 800,660 T1200,640 L1200,800 L0,800 Z" opacity="0.7"/>
    <!-- Joyful figure with sparkler -->
    <circle cx="560" cy="510" r="16"/>
    <path d="M560,526 L560,580 L545,640 M560,580 L575,640" stroke="#12051a" stroke-width="8" stroke-linecap="round"/>
    <path d="M560,545 L525,510 M560,545 L600,500" stroke="#12051a" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Second laughing companion -->
    <circle cx="640" cy="518" r="15"/>
    <path d="M640,533 L640,585 L625,640 M640,585 L655,640" stroke="#12051a" stroke-width="8" stroke-linecap="round"/>
    <path d="M640,550 L600,500 M640,550 L675,520" stroke="#12051a" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sparkler Golden Burst -->
  <g transform="translate(600, 500)">
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#cinematicGlow)"/>
    <line x1="0" y1="0" x2="-35" y2="-35" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="35" y2="-35" stroke="#fdcb6e" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-45" y2="10" stroke="#ffeaa7" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="45" y2="5" stroke="#fdcb6e" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="20" y2="40" stroke="#f6a035" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Film Frame Border & Typography -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#f6c445" stroke-width="2" opacity="0.4"/>
  <text x="600" y="110" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="#f6c445" text-anchor="middle" letter-spacing="8" opacity="0.9">CHAPTER II • THE GOLDEN DAYS</text>
  <text x="600" y="740" font-family="'Montserrat', sans-serif" font-size="16" fill="#fff" text-anchor="middle" letter-spacing="4" opacity="0.8">UNREHEARSED LAUGHTER &amp; TIMELESS MEMORIES</text>
</svg>
