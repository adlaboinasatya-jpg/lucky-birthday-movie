<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b173b"/>
      <stop offset="45%" stop-color="#0e0a22"/>
      <stop offset="85%" stop-color="#06040d"/>
      <stop offset="100%" stop-color="#020106"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#spaceGrad)"/>

  <!-- Golden Nebula Clouds -->
  <circle cx="600" cy="380" r="280" fill="#f6c445" opacity="0.12" filter="url(#starGlow)"/>
  <circle cx="400" cy="450" r="190" fill="#ff6b8b" opacity="0.1" filter="url(#starGlow)"/>
  <circle cx="820" cy="300" r="220" fill="#4deeea" opacity="0.08" filter="url(#starGlow)"/>

  <!-- Constellation Lines -->
  <g stroke="#f6c445" stroke-width="1.5" opacity="0.6" fill="none">
    <polyline points="280,320 380,240 520,290 600,200 740,240 850,180 920,280" />
    <polyline points="380,240 450,420 600,380 720,460 850,380 920,280" />
  </g>

  <!-- Constellation Major Stars -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="280" cy="320" r="6" />
    <circle cx="380" cy="240" r="8" fill="#ffeaa7"/>
    <circle cx="520" cy="290" r="5" />
    <circle cx="600" cy="200" r="11" fill="#fff9db"/>
    <circle cx="740" cy="240" r="7" />
    <circle cx="850" cy="180" r="9" fill="#ffeaa7"/>
    <circle cx="920" cy="280" r="6" />
    <circle cx="450" cy="420" r="7" />
    <circle cx="600" cy="380" r="10" fill="#fff9db"/>
    <circle cx="720" cy="460" r="7" />
    <circle cx="850" cy="380" r="8" />
  </g>

  <!-- Shimmering Star Crosses -->
  <g stroke="#ffffff" stroke-width="2" filter="url(#starGlow)">
    <line x1="570" y1="200" x2="630" y2="200"/>
    <line x1="600" y1="170" x2="600" y2="230"/>
    <line x1="575" y1="380" x2="625" y2="380"/>
    <line x1="600" y1="355" x2="600" y2="405"/>
  </g>

  <!-- Film Frame -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#f6c445" stroke-width="2" opacity="0.35"/>
  <text x="600" y="110" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="#f6c445" text-anchor="middle" letter-spacing="8" opacity="0.9">STARLIGHT &amp; WONDER</text>
  <text x="600" y="740" font-family="'Montserrat', sans-serif" font-size="16" fill="#fff" text-anchor="middle" letter-spacing="4" opacity="0.8">YOU ARE THE BRIGHTEST CONSTELLATION IN OUR SKY</text>
</svg>
