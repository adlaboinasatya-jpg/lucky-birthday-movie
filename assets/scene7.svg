<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#301538"/>
      <stop offset="45%" stop-color="#140a24"/>
      <stop offset="85%" stop-color="#070310"/>
      <stop offset="100%" stop-color="#020107"/>
    </radialGradient>
    <filter id="fwGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#skyGrad)"/>

  <!-- Golden Grand Firework Burst in Sky -->
  <g transform="translate(600, 320)" filter="url(#fwGlow)">
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <!-- Radiating burst rays -->
    <path d="M 0,0 L -180,-140 M 0,0 L 180,-140 M 0,0 L -220,0 M 0,0 L 220,0 M 0,0 L -160,130 M 0,0 L 160,130 M 0,0 L 0,-210 M 0,0 L 0,190" stroke="#f6c445" stroke-width="3" stroke-dasharray="10,15" stroke-linecap="round"/>
    <path d="M 0,0 L -120,-190 M 0,0 L 120,-190 M 0,0 L -200,-70 M 0,0 L 200,-70 M 0,0 L -200,70 M 0,0 L 200,70 M 0,0 L -100,180 M 0,0 L 100,180" stroke="#ff6b8b" stroke-width="2.5" stroke-dasharray="8,12" stroke-linecap="round"/>
  </g>

  <!-- Secondary Fireworks -->
  <g transform="translate(280, 220)" filter="url(#fwGlow)">
    <circle cx="0" cy="0" r="8" fill="#ffd166"/>
    <path d="M 0,0 L -90,-80 M 0,0 L 90,-80 M 0,0 L -110,0 M 0,0 L 110,0 M 0,0 L -80,80 M 0,0 L 80,80" stroke="#ffd166" stroke-width="2" stroke-dasharray="6,10"/>
  </g>
  <g transform="translate(920, 240)" filter="url(#fwGlow)">
    <circle cx="0" cy="0" r="8" fill="#4deeea"/>
    <path d="M 0,0 L -90,-80 M 0,0 L 90,-80 M 0,0 L -110,0 M 0,0 L 110,0 M 0,0 L -80,80 M 0,0 L 80,80" stroke="#4deeea" stroke-width="2" stroke-dasharray="6,10"/>
  </g>

  <!-- Film Frame -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="#f6c445" stroke-width="2" opacity="0.35"/>
  <text x="600" y="110" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="#f6c445" text-anchor="middle" letter-spacing="8" opacity="0.9">CHAPTER IV • THE CLIMAX</text>
  <text x="600" y="740" font-family="'Montserrat', sans-serif" font-size="16" fill="#fff" text-anchor="middle" letter-spacing="4" opacity="0.8">DREAMS TAKING FLIGHT INTO AN INFINITE TOMORROW</text>
</svg>
